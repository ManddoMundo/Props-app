# Fair Line daily job. Pulls the lines, runs the model, logs the day's paper bets, rebuilds the app in /docs.
# Secrets needed (Settings, Secrets and variables, Actions): ODDS_API_KEY and RELAY_PASS.
name: Fair Line daily
on:
  schedule:
    - cron: "10 11,12 * * *"   # about 7:10 AM Eastern: grade last night, refresh projections and injuries, rebuild the app (no credits)
    # Cron runs on UTC. Two times each so one lands at the right Eastern hour in both standard and daylight time;
    # the relay step decides what is due, and a run with nothing due exits.
    - cron: "27 15,16 * * *"   # about 11:30 AM Eastern: lines, injuries, model, picks, rebuild
    - cron: "57 21,22 * * *"   # about 6 PM Eastern: evening pass, fresh lines and injuries, closing numbers for the midday bets, a second look, line moves
    - cron: "37 22,23 * * *"   # about 6:40 PM Eastern: starting lineups (v3.24), or the evening pass if it was late
    - cron: "12 1,2 * * *"     # about 9:15 PM Eastern: starting lineups for the West coast games (v3.24)
    - cron: "30 16,17 * * 0"   # Sunday midday Eastern: NFL closing lines for the afternoon games
  workflow_dispatch:
    inputs:
      mode:
        description: "build (rebuild the app, no credits, no picks), early, midday, evening, close, lineups, test or auto"
        required: false
        default: "build"
permissions:
  contents: write
concurrency:
  group: fair-line
  cancel-in-progress: false
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open the books
        env:
          RELAY_PASS: ${{ secrets.RELAY_PASS }}
        run: bash pipeline/site_job.sh open
      - name: Pull lines and injury reports
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RELAY_PASS: ${{ secrets.RELAY_PASS }}
          RELAY_PLAIN: /home/claude/props/out
          MODE: ${{ github.event.inputs.mode == 'build' && 'none' || github.event.inputs.mode || 'auto' }}
        run: python3 pipeline/relay_pull.py
      - name: Run the day and rebuild the app
        env:
          RELAY_PASS: ${{ secrets.RELAY_PASS }}
          FORCE: ${{ github.event.inputs.mode == 'build' && 'build' || '' }}
        run: bash pipeline/site_job.sh run
      - name: Save to the repository
        if: always()
        run: |
          git config user.name "fair-line"
          git config user.email "fair-line@users.noreply.github.com"
          git add -A .
          if ! git diff --cached --quiet; then git commit -q -m "day $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q; fi
