    <p class="prose" style="margin-top:14px">Logged before ${S.lg === 'NFL' ? 'kickoff' : 'tip'} at the best price among seven sportsbooks (Hard Rock only before Nov 18) and graded from the box score. Two lanes. <b>Edge plays</b> need two other books quoting the same prop, an edge of 3 points after the market check, and no open question about the player. <b>Confident plays</b> are outcomes the other books rate at least 72% likely (main or alternate line), that the model agrees with on its own, at a price no worse than that fair chance: heavy prices are fine, overpaying is not. Up to three a league a day, kept on their own record. <b>Stakes</b>: one unit is $25 and each lane has $500. Edge plays: AAA 1½ units, AA 1, A ¾, BBB ½, plus ½ on the day's best bet. Confident plays: ½ to 2 units, more when the price beats the books' fair chance by more and the books rate it more likely. If the lanes log fewer than two bets, the best remaining positive sides go on as <b>leans</b> at a quarter unit; nothing below break-even is ever bet. No bet over 2 units, no day over 10. About 6 PM an <b>evening pass</b> reprices the games still to come with fresh lines and injuries, under the same rules; it never adds a second ticket on a player and never changes a midday ticket.${cenTxt}</p>
    ${movesHtml}
    ${passed.length ? `<div class="hd"><h2>Passed on</h2><span>the closest calls from ${esc(lastDate)} and the test each one failed${B.some(b => b.lean && b.date === lastDate) ? '. Leans are the exception to the 3-point bar: on a day nothing clears it, the desk logs its top one or two edges of 1 point or more at a quarter unit, so a lean can sit below the bar while a smaller edge here is passed' : ''}</span></div><div class="passes">${passed.map(passHtml).join('')}</div>` : ''}
    <div class="hd"><h2>The ledger</h2><span>${(() => { const g = settled.filter(b => !b.superseded && (st(b) === 'won' || st(b) === 'lost')).length, rp = settled.filter(b => b.superseded).length, ot = settled.length - g - rp; return `${settled.length} settled: ${g} graded${ot ? `, ${ot} push or void` : ''}${rp ? `, ${rp} replaced by a later ticket` : ''}`; })()}</span></div>
    ${n ? `<div class="grid2" style="margin-bottom:14px">${split('By market', b => b.lg + '|' + b.mkt, k => k.split('|')[0] + ' ' + MK[k.split('|')[0]][k.split('|')[1]].n)}${split('By rating', b => b.rating, k => k)}</div>` : ''}
    <div class="ledger">${settled.length ? settled.map(srow).join('') : '<div class="row"><span class="mut">Nothing settled yet. Bets settle on the next daily refresh after the game.</span></div>'}</div>
    <p class="prose" style="margin-top:12px">A hit rate needs a few hundred bets before it says much. Over a week or two, luck is most of the number. The closing line column will say something sooner.</p>`;
}

/* ---------- model ---------- */
function modelHtml() {
  const lg = S.lg, L = DATA[lg], bt = L.backtest, keys = Object.keys(MK[lg]).filter(k => bt[k]);
  if (!S.relMkt || !bt[S.relMkt]) S.relMkt = keys[0];
  const rel = bt[S.relMkt].reliability || [], W = 320, x = v => 34 + v * 270, y = v => 286 - v * 270;
  let g = `<rect x="34" y="16" width="270" height="270" fill="none" stroke="var(--rule)"/><line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--mute)" stroke-dasharray="4 4"/>`;
  for (const t of [0, .25, .5, .75, 1]) g += `<text x="${x(t)}" y="302" text-anchor="middle">${t * 100}%</text><text x="28" y="${y(t) + 4}" text-anchor="end">${t * 100}</text>`;
  g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${rel.map(r => x(r.pred) + ',' + y(r.obs)).join(' ')}"/>` + rel.map(r => `<circle cx="${x(r.pred)}" cy="${y(r.obs)}" r="${Math.max(3, Math.min(8, Math.sqrt(r.n) / 9))}" fill="var(--accent)"><title>Model said ${pct(r.pred)}, happened ${pct(r.obs)} of ${r.n} times</title></circle>`).join('');
  const B = DESK.bets.filter(b => !b.superseded), gr = B.filter(b => b.status === 'won' || b.status === 'lost').length, cl = B.filter(b => b.close);
  const cal = Object.entries(DATA.calib || {}).filter(([k, v]) => k.startsWith(lg + '|') && v.n);
  const LD = DESK.days.filter(d => d.lg === lg), lastDate = LD.length ? LD[LD.length - 1].date : null, dd = LD.filter(d => d.date === lastDate), priced = sum(dd.map(d => d.sides_priced || 0)), bet = sum(dd.map(d => d.picks || 0));      // v3.14.2: this league's slate
  return `${mast('model', 'The model audit')}${storyHtml()}<p class="prose" id="audit">${esc(String(L.backtest_note).replace('Fit on 2023-24 seasons', 'Fit on the 2023 and 2024 seasons'))} Every projection in the test used only games played before it. Data through ${esc(L.data_through)}.</p>
  <div class="card" style="margin-bottom:16px"><div class="sec"><h3><span>Standing orders</span></h3></div>
    <ol class="orders">
      <li><b>Price before prediction.</b><span>The desk takes each side at whichever of seven books pays the most for it (since Nov 18; Hard Rock only before). Shopping alone was worth about 4 cents a dollar on the same lines last season. The lever is still to pass unless a price is out of line with the other books, or the model disagrees about one player by more than it does about the rest.</span></li>
      <li><b>Judge the desk by the closing line.</b><span>Wins and losses take hundreds of bets to mean anything. Whether the price taken beat the closing price shows up in weeks. ${cl.length ? `Tracked on ${cl.length} bet${cl.length === 1 ? '' : 's'} so far.` : 'Tracking starts with the next card.'}</span></li>
      <li><b>Pass most of the time.</b><span>${priced ? `On ${esc(lastDate)} the desk priced ${priced} ${lg} sides and bet ${bet}.` : 'Most sides priced are never bet.'} That ratio is the job, not a slow night.</span></li>
      <li><b>Sized stakes, no chasing.</b><span>A quarter unit to two units, set by the grade before the bet, never after a result. No doubling after a loss and no extra bets to get even.</span></li>
      <li><b>Paper until the record earns more.</b><span>The bar is 300 graded bets with closing line value above zero and a hit rate above break even. Today: ${gr} graded bets and ${(DATA.audit_n || 0).toLocaleString()} graded sides in the audit, which so far show the desk about level with a coin flip against Hard Rock's own line. That is not an edge yet.</span></li>
      <li><b>A bankroll is money that can go to zero.</b><span>Even a real edge has long losing runs. Professionals keep the roll apart from living money for that reason.</span></li>
    </ol></div>
  <div class="grid2"><div class="card scroll"><table><thead><tr><th>Market</th><th>Tested</th><th>Avg miss</th><th>Last 5 avg miss</th><th>Better by</th><th>80% band held</th></tr></thead><tbody>
    ${keys.map(k => { const b = bt[k]; if (!b.mae_model_vs_l5) return `<tr><td>${MK[lg][k].n}</td><td>${b.n.toLocaleString()}</td><td colspan="4" style="text-align:left;font-family:var(--text)" class="mut">Scored on probability. See the chart.</td></tr>`;
      const [m, l] = b.mae_model_vs_l5; return `<tr><td>${MK[lg][k].n}</td><td>${b.n.toLocaleString()}</td><td>${m.toFixed(2)}</td><td>${l.toFixed(2)}</td><td class="pos">${((1 - m / l) * 100).toFixed(1)}%</td><td>${pct(b.cover80)}</td></tr>`; }).join('')}
    </tbody></table><p class="prose" style="margin:10px 0 0">Avg miss is the average gap between projection and result. The comparison is the simplest thing a bettor does by hand: the player's last five game average.</p>
    ${cal.length ? `<table style="margin-top:14px"><thead><tr><th>The model's say against the market</th><th>Weight</th><th>Graded lines</th></tr></thead><tbody>${cal.map(([k, v]) => `<tr><td>${MK[lg][k.split('|')[1]].n}</td><td>${Math.round(v.w * 100)}%</td><td>${v.n}</td></tr>`).join('')}</tbody></table>
    <p class="prose" style="margin:10px 0 0">The desk number is the other books' number, moved this share of the way toward the model. The share is relearned from every graded line, so a market the model reads well earns more say.</p>` : ''}</div>
  <div class="card"><div class="sec"><h3><span>When the model says 60%, does it happen 60%?</span></h3></div>
    <div class="filters"><select id="relMkt" aria-label="Market for calibration chart">${keys.map(k => `<option value="${k}"${k === S.relMkt ? ' selected' : ''}>${MK[lg][k].n}</option>`).join('')}</select></div>
    <svg viewBox="0 0 ${W} 310" style="max-width:420px" role="img" aria-label="Calibration chart">${g}</svg>
    <p class="prose" style="margin:8px 0 0">Across: the probability the model gave. Up: how often it happened. Dots on the dashed line mean the stated probabilities are honest.</p></div></div>
  <div class="card prose" style="margin-top:14px;max-width:none"><b>What this audit does and does not prove.</b>
    <ul><li><b>Proven:</b> the projections beat a last five average in every market, and the probabilities are close to honest on games the model never saw.</li>
    <li><b>Not proven:</b> profit. Beating a simple average is easier than beating a sportsbook. The desk record and the closing line column are that test, and they are young.</li>
    <li><b>Lineups:</b> the daily run reads the injury report and the books. A player ruled out sits, a player the books are quoting plays, and the book's passing line names the quarterback. News after the run is not seen. Use Stress test when it breaks.</li>
    <li><b>Market check:</b> desk odds blend the model with what three other books imply, and the model is centred on the market each slate so a general lean cannot create bets.</li>
    ${lg === 'NBA' ? `<li><b>Why centring is needed:</b> players the books quote have played about 8 percent more minutes than the model projects. A quote is itself news: the book expects a full night.</li>
    <li><b>Tested and left out:</b> back to back rest and home or away. Neither lowered the miss on games the model had not seen.</li>` : `<li><b>Why centring is needed:</b> players the books quote have a bigger role than the model's recent-game average projects. A quote is itself news: the book expects a full workload.</li>`}
    <li><b>Blind spots:</b> coaching changes, weather, snap share, anything after the daily pull.</li>
    <li><b>Method:</b> ${lg === 'NBA' ? 'minutes times per minute rate, with team minutes forced to 240 and each stat pulled toward what this team and opponent allow.' : 'team pass attempts and carries from the spread and total, split by each player’s share, times his efficiency, adjusted for the defense.'} A negative binomial curve around each projection prices any line.</li></ul></div>`;
}

/* ---------- research room ---------- */
// Matchup sheets built by research_nfl.py from free play-by-play, plus hit rates against the lines on file.
// Context for reading a price. None of it feeds the pick policy.
const RS = { d:null, st:'idle' };
const RTOOLS = [['nmu','Matchups'],['role','Role matchups'],['hit','Hit rates'],['split','Trends by split'],['grade','Market grades'],['td','Touchdowns'],['ftd','First touchdown'],['rz','Red zone'],['lanes','Run lanes'],['share','Team share'],['teams','Team board'],['tend','Tendencies'],['line','Trenches']];
const ROLES = ['QB','RB1','RB2','WR1','WR2','WR3','TE1','TE2'];
const NBA_T = ['nmu', 'hit', 'split', 'grade'];
const rsTool = () => S.lg === 'NBA' ? (NBA_T.includes(S.rs.tool) ? S.rs.tool : 'nmu') : (S.rs.tool === 'nmu' ? 'role' : S.rs.tool);
// v3.19: in the order the picker lists them (grouped), so a sheet's number, the arrows and the dots match the list
const rOrd = k => { const i = RGRP.flatMap(g => g[1]).indexOf(k); return i < 0 ? 999 : i; };
const rtools = () => (S.lg === 'NBA' ? RTOOLS.filter(t => NBA_T.includes(t[0])) : RTOOLS.filter(t => t[0] !== 'nmu')).slice().sort((a, b) => rOrd(a[0]) - rOrd(b[0]));
const avg = a => a.length ? sum(a) / a.length : 0;
const nz = (x, d = 1) => x == null || !isFinite(x) ? '·' : (+x).toFixed(d);
const t12 = t => { const [h, m] = String(t).split(':').map(Number); return `${(h + 11) % 12 + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
// Rank chip. tone 1: a low rank helps the side being read (green, arrow up). tone 0: ranked by amount only, no colour.
const rk = (r, tone = 1, n = 32) => !r ? '' : `<span class="rk ${!tone ? 'n' : r <= 8 ? 'g' : r > n - 8 ? 'b' : 'n'}" title="Rank ${r} of ${n}">${!tone ? '' : r <= 8 ? '▲' : r > n - 8 ? '▼' : ''}${r}</span>`;
const chips = (key, cur, opts, label) => `<div class="seg rsg" data-seg="rs-${key}" role="group" aria-label="${label}"><span class="seg-ink" aria-hidden="true"></span>${opts.map(([v, n]) => `<button data-rs="${key}:${v}" aria-pressed="${cur === v}">${n}</button>`).join('')}</div>`;
const sheet = (title, table, cls) => `<div class="card${cls ? ' ' + cls : ''}">${title ? `<div class="sec"><h3><span>${title}</span></h3></div>` : ''}<div class="scroll">${table}</div></div>`;
const on = p => p.st !== 'IR' && p.st !== 'OFF';

function loadResearch() {
  if (RS.st !== 'idle') return; RS.st = 'loading';
  fetch('research/nfl.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
    const by = {}; for (const id in d.players) { const p = d.players[id]; p.id = id; (by[p.t] = by[p.t] || []).push(p); }
    const o = p => (p.role ? ROLES.indexOf(p.role) : 9);
    for (const t in by) by[t].sort((a, b) => o(a) - o(b) || b.snap - a.snap);
    d.by = by; RS.d = d; RS.st = 'ready'; if (S.tab === 'research') rsPaint();
  }).catch(() => { RS.st = 'error'; if (S.tab === 'research') rsPaint(); });
}
const rsGame = R => R.games.find(g => g.id === S.rs.game) || R.games.find(g => IDX.NFL.games[g.id]) || R.games[0];
const NFLNUM = () => { if (!NFLNUM.m) { NFLNUM.m = {}; (DATA.NFL.players || []).forEach(q => { NFLNUM.m[q.id] = q.num; }); } return NFLNUM.m; };
const rjy = p => jersey('NFL', { team: p.t, num: NFLNUM()[p.id], pos: p.pos });
function pname(p, gid, mkts, bare) {       // a name the desk has priced opens his credit memo
  const k = (mkts || []).map(m => `NFL|${gid}|${p.id}|${m}`).find(k => PMAP[k]), tag = p.st ? ` <span class="stt">${p.st}</span>` : '';
  const n = k ? `<button class="pn" data-open="${esc(k)}" title="Open the credit memo">${esc(p.n)}</button>${tag}` : `<span class="pn">${esc(p.n)}</span>${tag}`;
  return bare ? n : `<span class="mj" style="${tcol('NFL', p.t)}">${rjy(p)}</span>${n}`;
}
const sides = g => [[g.away, g.home], [g.home, g.away]];
const live = (R, g) => sides(g).flatMap(([t, opp]) => (R.by[t] || []).filter(on).map(p => ({ p, t, opp })));

function fixtureHtml(R, g) {
  const sp = g.spread, tot = g.total, has = sp != null && tot != null, ia = has ? tot / 2 - sp / 2 : null, ih = has ? tot / 2 + sp / 2 : null;
  const fav = sp == null ? 'No line yet' : sp > 0 ? `${g.home} by ${sp}` : sp < 0 ? `${g.away} by ${-sp}` : 'Pick em', share = has ? Math.max(8, Math.min(92, ia / tot * 100)) : 50;
  const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), far = (x, y) => { const p = hx(x), q = hx(y); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]) > 110; };
  const TA = TC.NFL[g.away] || ['#2b3442', '#888888'], TH = TC.NFL[g.home] || ['#2b3442', '#888888'], ca = TA[0], ch = far(TA[0], TH[0]) ? TH[0] : TH[1];      // two navy clubs: the home side of the bar takes its second colour
  const side = (t, ip, lbl, c) => `<div class="fx-t ${c}" style="${tcol('NFL', t)}">${badge('NFL', t, 'wm')}<small>${lbl}</small><b>${t}</b><em>${esc(R.teams[t].n)}</em>${ip != null ? `<span class="fx-ip"><b class="tick" data-k="fx-${c}" data-to="${ip.toFixed(1)}" data-dp="1">${ip.toFixed(1)}</b><small>implied points</small></span>` : ''}</div>`;
  return `<section class="fx2${S.fresh ? ' in' : ''}" style="--ca:${ca};--ch:${ch}" aria-label="${g.away} at ${g.home}">
    ${side(g.away, ia, 'Away', 'a')}
    <div class="fx-mid"><span class="fx-at">@</span><span class="fx-ko">${esc(g.wd.toUpperCase())} ${t12(g.time)}</span><small>${esc(g.day)} · ET</small></div>
    ${side(g.home, ih, 'Home', 'h')}
    <div class="fx-bar"><div class="fx-tug" role="img" aria-label="Implied points ${g.away} ${has ? ia.toFixed(1) : '?'}, ${g.home} ${has ? ih.toFixed(1) : '?'}"><i style="--w:${share}%"></i><span></span></div>
      <div class="fx-ch"><span>Favourite <b>${fav}</b></span><span>Total <b>${tot == null ? '·' : tot}</b></span><span>Week <b>${g.week}</b></span><span>Stats through <b>week ${R.thru}</b></span></div></div></section>`;
}

/* role matchups: his average on top, what this defense allows to his role underneath */
const LENS = { rec:  { n:'Receiving', roles:['WR1','WR2','WR3','TE1','TE2','RB1','RB2'], cols:[['tgt','Targets'],['rec','Catches'],['ryd','Yards'],['rtd','TD']], head:'ryd', mk:['rec_yds','rec'] },
               rush: { n:'Rushing', roles:['RB1','RB2','QB'], cols:[['car','Carries'],['ruyd','Yards'],['rutd','TD']], head:'ruyd', mk:['rush_yds','rush_att'] },
               pass: { n:'Passing', roles:['QB'], cols:[['att','Attempts'],['cmp','Completions'],['pyd','Yards'],['ptd','TD'],['int','INT']], head:'pyd', mk:['pass_yds','pass_att'] } };
const dec2 = k => /td$|^int$/.test(k) ? 2 : 1;
function roleHtml(R, g) {
  const L = LENS[S.rs.lens] || LENS.rec, hn = L.cols.find(c => c[0] === L.head)[1].toLowerCase();
  const side = ([off, def]) => { const A = R.allow[def];
    const cards = L.roles.map((role, i) => { const p = (R.by[off] || []).find(p => p.role === role); if (!p) return '';
      const a = A[role], l = R.lg[role][L.head], dv = l ? a[L.head][0] / l - 1 : 0, cls = dv >= .1 ? 'g' : dv <= -.1 ? 'b' : 'n';
      const word = dv >= .25 ? 'Soft spot' : dv >= .1 ? 'Leans soft' : dv <= -.25 ? 'Locked down' : dv <= -.1 ? 'Leans tough' : 'Even';
      return `<article class="rc" style="${tcol('NFL', p.t)};--i:${i}">
        <header>${rjy(p)}<div class="rc-n"><span class="rl">${role}</span>${pname(p, g.id, L.mk, 1)}<small>${p.gp} games · ${nz(p.snap, 0)}% of snaps</small></div>
          <div class="rc-g ${cls}" title="${def} allows ${role}s ${sgn(dv * 100, 0)}% ${hn} against the league"><b>${sgn(dv * 100, 0)}%</b><small>${word}</small><span class="gauge"><i style="--w:${Math.min(50, Math.abs(dv) * 100).toFixed(0)}%" class="${dv >= 0 ? 'up' : 'dn'}"></i></span></div></header>
        <div class="rc-s">${L.cols.map(([k, n]) => `<div><small>${n}</small><b>${nz(p.pg[k], dec2(k))}</b><span>${def} allows</span><span>${nz(a[k][0], dec2(k))} ${rk(a[k][1], k === 'int' ? 0 : 1)}</span></div>`).join('')}</div></article>`; }).join('');
    return `<div class="card rcs"><div class="rc-band" style="${tcol('NFL', off)}"><b>${off}</b><span>${L.n.toLowerCase()} against the ${esc(R.teams[def].n)} defense</span></div>${cards}</div>`; };
  return `${chips('lens', S.rs.lens, Object.entries(LENS).map(([k, v]) => [k, v.n]), 'Lens')}<div class="two">${sides(g).map(side).join('')}</div>
    <p class="note">Big figure: his average a game this season. Under it: what this defense has allowed a game to whoever filled his role, with its rank (1 allows the most, so a low rank with an up arrow is soft). The gauge compares the ${hn} this defense allows his role with the league: right and green is a soft spot, left and red is locked down. Receiver and tight end roles follow snaps, back roles follow carries and targets, over the last five games. An underlined name opens his credit memo.</p>`;
}

function tdHtml(R, g) {
  const rows = live(R, g).filter(x => x.p.role || x.p.td > 0).sort((a, b) => b.p.tdg / b.p.gp - a.p.tdg / a.p.gp || b.p.rz[0] - a.p.rz[0]);
  const body = rows.map(({ p, t, opp }) => { const a = p.role ? R.allow[opp][p.role].td : null, pr = PMAP[`NFL|${g.id}|${p.id}|any_td`], pm = pr ? 1 - Math.exp(-pr.mu) : null, r = p.tdg / p.gp;
    return `<tr><td class="pc">${pname(p, g.id, ['any_td'])}<small>${p.role || p.pos} · ${t}</small></td><td>${p.td}</td><td class="barc" style="--w:${Math.round(r * 100)}%"><b>${p.tdg} of ${p.gp}</b><small>${Math.round(r * 100)}% of games</small></td><td>${nz(p.rz[0], 1)}</td><td>${p.rz[3] || !p.rz[0] ? nz(p.rz[3], 0) + '%' : '<span class="mut" title="His looks came with another club">·</span>'}</td><td>${a ? `${nz(a[0], 2)} ${rk(a[1])}` : '·'}</td><td>${pm == null ? '<span class="mut">·</span>' : `<b>${odds(E.amer(pm))}</b><small>${pct(pm)}</small>`}</td></tr>`; }).join('');
  return sheet('Anytime touchdown: who scores, and how often', `<table class="rt"><thead><tr><th class="pc">Player</th><th>TDs</th><th>Scored in</th><th>Red zone looks a game</th><th>Share of team's looks</th><th>TDs a game the opponent allows his role</th><th>Model fair price</th></tr></thead><tbody>${body}</tbody></table>`) +
    `<p class="note">Rushing and receiving touchdowns only. A red zone look is a carry or a target from the 20 or closer. The fair price is the model's own, before any book line: compare it with the anytime price your book shows, and expect the book to shade every name.</p>`;
}

function ftdHtml(R, g) {
  const eo = R.early.off, ed = R.early.dfn;
  const tiles = sides(g).map(([o, d]) => `<div class="tile"><small>${o} first two drives</small><b>${nz(eo[o][0], 0)}%</b><span class="tn">of ${eo[o][1]} opening drives ended in a touchdown, rank ${rk(eo[o][2])} The ${esc(R.teams[d].n)} have allowed one on ${nz(ed[d][0], 0)}% of ${ed[d][1]}, rank ${rk(ed[d][2])} League: ${nz(R.early.lg, 0)}%.</span></div>`).join('');
  const rows = live(R, g).filter(x => x.p.ftd > 0 || x.p.early[0] >= 4).sort((a, b) => b.p.ftd - a.p.ftd || b.p.early[1] - a.p.early[1]);
  return `<div class="tiles t2">${tiles}</div>` + sheet('First touchdown of the game', `<table class="rt"><thead><tr><th class="pc">Player</th><th>First TDs</th><th>Games</th><th>Touches on the first two drives</th><th>Share of team's early touches</th><th>All TDs</th></tr></thead><tbody>${rows.map(({ p, t }) =>
    `<tr><td class="pc">${pname(p, g.id, ['any_td'])}<small>${p.role || p.pos} · ${t}</small></td><td><b>${p.ftd}</b></td><td>${p.gp}</td><td>${p.early[0]}</td><td class="barc" style="--w:${Math.min(100, Math.round(p.early[1] * 2))}%">${nz(p.early[1], 0)}%</td><td>${p.td}</td></tr>`).join('')}</tbody></table>`) +
    `<p class="note">First TDs counts games where he scored the first offensive touchdown by either team. A touch is a carry or a target. The sample is small by nature: nine or ten games, one first score each. Read the early touches, which repeat, before the count, which mostly does not.</p>`;
}

function rzHtml(R, g) {

    `<tr><td class="pc">${pname(p, g.id, ['any_td', 'rush_yds', 'rec_yds'])}<small>${p.role || p.pos} · ${t}</small></td><td><b>${nz(p.rz[0], 1)}</b></td><td>${p.rz[1]}</td><td>${p.rz[2]}</td><td class="barc" style="--w:${Math.min(100, Math.round(p.rz[3]))}%">${nz(p.rz[3], 0)}%</td><td>${p.rz[4]}</td></tr>`).join('')}</tbody></table>`) +
    `<p class="note">A trip is a drive that ran a play from the 20 or closer. Share is his looks over the team's looks in the games he played.</p>`;

function lanesHtml(R, g) {

  const one = (p, def) => { const D = R.run.dfn[def];
    return `<div class="card"><div class="lh">${pname(p, g.id, ['rush_yds', 'rush_att'])}<small>${p.role || p.pos} · ${p.t} · ${p.run.n} runs · ${nz(p.run.share, 0)}% of team carries</small></div><div class="lanes">${LN.map((l, i) => { const d = D[l];

  const cards = sides(g).flatMap(([o, d]) => (R.by[o] || []).filter(p => p.run && p.run.share > 0 && p.run.n >= (p.pos === 'RB' ? 15 : 30) && on(p)).sort((a, b) => b.run.n - a.run.n).slice(0, 3).map(p => one(p, d)));

    <p class="note">Each column is a lane, seen from behind the offense. The bar is how much of his running goes that way. Under it: his yards a carry in that lane, then what this defense allows there and where that ranks (rank 1 allows the most). League average: left ${nz(R.run.lg.left, 1)}, middle ${nz(R.run.lg.middle, 1)}, right ${nz(R.run.lg.right, 1)}. Scrambles are left out. Backs need 15 charted runs to appear, anyone else 30.</p>`;
}

function shareHtml(R, g) {

const BCOLS = { all:  [['pts','Points'],['epa','EPA a play'],['succ','Success %'],['ypp','Yards a play'],['expl','Explosive %'],['third','3rd down %'],['rztd','Red zone TD %'],['to','Turnovers']],

function teamsHtml(R, g) {
  const side = S.rs.side === 'dfn' ? 'dfn' : 'off', B = R.board[side], grp = BCOLS[S.rs.grp] ? S.rs.grp : 'all', cols = BCOLS[grp], sk = cols.some(c => c[0] === S.rs.sort) ? S.rs.sort : cols[0][0];

    ${sheet('', `<table class="rt stick"><thead><tr><th>Team</th>${cols.map(([k, n]) => `<th aria-sort="${k === sk ? 'ascending' : 'none'}"><button data-rs="sort:${k}">${n}${k === sk ? ' ▾' : ''}</button></th>`).join('')}</tr></thead><tbody>${ts.map(t =>
      `<tr class="${t === g.away || t === g.home ? 'me' : ''}"><td><b class="tm">${t}</b></td>${cols.map(([k, , tone]) => `<td>${nz(B[t][k][0], bdec(k))} ${rk(B[t][k][1], tone === 0 ? 0 : 1)}</td>`).join('')}</tr>`).join('')}</tbody></table>`)}
    <p class="note">A game, except rates. Rank 1 is the best at it for the side shown, and a column header sorts by it. The two teams in the fixture are shaded. On the defense side each figure is what that defense gives up, apart from sacks, pressure, QB hits, interceptions, turnovers and stuffs, which it creates. Depth of target, deep throws and blitz rate are styles, not grades, so they carry no colour. Explosive: a pass of 20 or a run of 10.</p>`;

const TEND = [['proe','Pass rate over expected','%'],['npass','Pass rate, score and clock neutral','%'],['pace','Seconds of possession a play',''],['plays','Plays a game',''],['shot','Shotgun','%'],['nohud','No huddle','%'],['pa','Play action on dropbacks','%'],['motion','Motion at the snap','%'],['screen','Screens','%'],['rpo','Run-pass option','%'],['go4','Goes for it on 4th and 2 or less','%'],['box','Defense: men in the box against the run',''],['dblitz','Defense: blitz rate','%']];
function tendHtml(R, g) {
  const T = R.tend, all = Object.keys(T);
  const rows = TEND.map(([k, n, u]) => { const v = all.map(t => T[t][k][0]).filter(x => x != null).sort((a, b) => a - b); if (!v.length) return '';
    const lo = v[0], hi = v[v.length - 1], med = v[v.length >> 1], X = x => (8 + (hi > lo ? (x - lo) / (hi - lo) : .5) * 204).toFixed(1), a = T[g.away][k], h = T[g.home][k], d = k === 'proe' || k === 'pace' || k === 'box' ? 2 : 1, f = x => (k === 'proe' ? sgn(x, d) : nz(x, d)) + u;
    return `<tr><td class="pc tl">${n}</td><td class="trk"><svg viewBox="0 0 220 26" role="img" aria-label="${g.away} ${f(a[0])}, ${g.home} ${f(h[0])}, league middle ${f(med)}"><line x1="8" x2="212" y1="13" y2="13" stroke="var(--rule)" stroke-width="2"/><line x1="${X(med)}" x2="${X(med)}" y1="4" y2="22" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="2 2"/><circle cx="${X(a[0])}" cy="13" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/><rect x="${X(h[0]) - 5.5}" y="7.5" width="11" height="11" transform="rotate(45 ${X(h[0])} 13)" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></svg></td><td>${f(a[0])}${k === 'go4' ? ` <small class="in">of ${T[g.away].go4n[0]}</small>` : ''} ${rk(a[1], 0)}</td><td>${f(h[0])}${k === 'go4' ? ` <small class="in">of ${T[g.home].go4n[0]}</small>` : ''} ${rk(h[1], 0)}</td></tr>`; }).join('');
  return sheet('How each team chooses to play', `<table class="rt"><thead><tr><th class="pc">Tendency</th><th class="pc">League low to high</th><th>&#9675; ${g.away}</th><th>&#9670; ${g.home}</th></tr></thead><tbody>${rows}</tbody></table>`) +

}

const TR = [['Pass protection against the rush', [['sack', 'Sack rate', '%'], ['press', 'Pressure rate', '%'], ['qbhit', 'QB hits a game', ''], ['blitz', 'Blitz rate faced, and sent', '%', 0]]],
            ['Run blocking against the front', [['ypc', 'Yards a carry', '', 1, 2], ['ybc', 'Yards before contact', '', 1, 2], ['stuff', 'Stuffed for no gain', '%'], ['xrush', 'Runs of 10 or more', '%']]]];
function lineHtml(R, g) {
  const O = R.board.off, D = R.board.dfn;
  const side = ([o, d]) => `<div class="card"><div class="sec"><h3><span>${o} line against the ${esc(R.teams[d].n)} front</span></h3></div><div class="scroll"><table class="rt"><thead><tr><th class="pc">Measure</th><th>${o} offense</th><th>${d} defense</th><th>Edge</th></tr></thead><tbody>
    ${TR.map(([h, ms]) => `<tr class="sub"><td colspan="4">${h}</td></tr>` + ms.map(([k, n, u, tone, dp]) => { const a = O[o][k], b = D[d][k], df = b[1] - a[1], e = tone === 0 ? '' : df >= 10 ? `<span class="rate g">${o}</span>` : df <= -10 ? `<span class="rate b">${d}</span>` : '<span class="rate n">Even</span>';
      return `<tr><td class="pc tl">${n}</td><td>${nz(a[0], dp || 1)}${u} ${rk(a[1], tone === 0 ? 0 : 1)}</td><td>${nz(b[0], dp || 1)}${u} ${rk(b[1], tone === 0 ? 0 : 1)}</td><td>${e}</td></tr>`; }).join('')).join('')}</tbody></table></div>
    <div class="sec" style="margin-top:16px"><h3><span>${d} pass rushers</span></h3></div><div class="scroll"><table class="rt"><thead><tr><th class="pc">Rusher</th><th>Pressures</th><th>Sacks</th><th>Hurries</th></tr></thead><tbody>${(R.rushers[d] || []).slice(0, 5).map(r => `<tr><td class="pc">${esc(r[0])} <small class="in">${esc(r[1])}</small></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec" style="margin-top:16px"><h3><span>${d} in coverage: what each defender has allowed</span></h3></div><div class="scroll"><table class="rt"><thead><tr><th class="pc">Defender</th><th>Targets</th><th>Completion %</th><th>Yards</th><th>Yards a target</th><th>TD</th><th>INT</th><th>Passer rating</th></tr></thead><tbody>${(R.cover[d] || []).slice(0, 7).map(c => `<tr><td class="pc">${esc(c[0])} <small class="in">${esc(c[1])}</small></td><td>${c[2]}</td><td>${nz(c[3], 0)}%</td><td>${c[4]}</td><td>${nz(c[5], 1)}</td><td>${c[6]}</td><td>${c[7]}</td><td>${nz(c[8], 1)}</td></tr>`).join('')}</tbody></table></div></div>`;

const lineTxt = x => x === 0 ? 'PK' : (x > 0 ? '+' : '') + x;
function trackHtml(lg, G) {      // the walk-forward record, one season per column: every game priced with only what was known before it
  const SS = G.seasons || []; if (!SS.length) return '';
  const H = S.gm, md = H.tr = ['ats', 'su', 'ou'].includes(H.tr) ? H.tr : 'ats';
  const lab = s => lg === 'NBA' ? `${String(s - 1).slice(2)}-${String(s).slice(2)}` : `'${String(s).slice(2)}`;
  const r = a => a && a[0] + a[1] ? a[0] / (a[0] + a[1]) : null;
  const [lo, hi] = md === 'su' ? [.5, .8] : [.3, .7], Y = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const key = lg === 'NFL' && md === 'ats' ? 'edge' : md;
  const cols = SS.map((x, j) => {
    if (md === 'su') { const a = x.su, b = x.su_mkt; return `<div class="tr-c" style="--j:${j}" title="${lab(x.s)}: our ratings ${a != null ? pct(a) : '-'}, the line's favourite ${b != null ? pct(b) : '-'}">
      <em></em><div class="tr-p"><i class="tr-b us" style="height:${a != null ? Y(a) : 0}%"></i><i class="tr-b bk" style="height:${b != null ? Y(b) : 0}%"></i></div><small>${lab(x.s)}</small></div>`; }
    const a = x[key], v = r(a); return `<div class="tr-c" style="--j:${j}" title="${lab(x.s)}: ${a ? a[0] + '-' + a[1] : 'no lines'}">
      <em>${v != null ? Math.round(v * 100) : ''}</em><div class="tr-p"><i class="tr-b ${v == null ? '' : v >= .524 ? 'up' : 'dn'}" style="height:${v != null ? Y(v) : 0}%"></i></div><small>${lab(x.s)}</small></div>`; }).join('');
  const tot = SS.reduce((t, x) => { const a = md === 'su' ? null : x[key]; if (a) { t[0] += a[0]; t[1] += a[1]; } return t; }, [0, 0]);
  const up = md === 'su' ? 0 : SS.filter(x => r(x[key]) != null && r(x[key]) >= .524).length, nn = md === 'su' ? 0 : SS.filter(x => r(x[key]) != null).length;
  const sum = md === 'su' ? `Bars: our ratings (left) and the line's favourite (right), share of winners picked. The line was right more often in ${SS.filter(x => x.su_mkt != null && x.su_mkt > x.su).length} of ${SS.filter(x => x.su_mkt != null).length} seasons.`
    : `${lg === 'NFL' && md === 'ats' ? 'Edge spots (4.5+ points off the line)' : md === 'ats' ? 'Every spread, our ratings against the line' : 'Every total, our side against the line'}: ${tot[0]}-${tot[1]} (${tot[0] + tot[1] ? pct(tot[0] / (tot[0] + tot[1])) : '-'}), above 52.4% in ${up} of ${nn} seasons.`;
  return `<section class="card tr${S.fresh ? ' in' : ''}" aria-label="Track record">
    <div class="tr-h"><div><span class="tr-k">Track record · tested before each game</span><b>How it would have done</b></div>
      <div class="seg so" data-seg="gm-tr" role="group" aria-label="Market"><span class="seg-ink" aria-hidden="true"></span><button data-gm="tr:ats" aria-pressed="${md === 'ats'}">${lg === 'NFL' ? 'Edge spots' : 'Spread'}</button><button data-gm="tr:su" aria-pressed="${md === 'su'}">Winners</button><button data-gm="tr:ou" aria-pressed="${md === 'ou'}">Totals</button></div></div>
    <div class="tr-g" style="--n:${SS.length}">${md === 'su' ? '' : `<span class="tr-be" style="bottom:calc(${(Y(.524) * 1.46).toFixed(1)}px + 16px)"><b>52.4% breaks even at -110</b></span>`}${cols}</div>
    <p class="tr-s">${sum}</p></section>`;
}
function movesHtml(lg, G) {      // what line moves, key numbers, roofs and wind have meant, measured on the games on file
  const M = G.mvbt; if (!M) return '';
  const X = (v, lo = .4, hi = .65) => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const row = (t, a, note, sub) => { if (!a || !(a[0] + a[1])) return ''; const v = a[0] / (a[0] + a[1]), c = v >= .54 ? 'up' : v <= .48 ? 'dn' : '';

    row('Underdog after the favourite is pushed through 3', M.key3_dog, 'no edge', 'the hook matters for price, not for picking a side'),
    row('Totals: follow the move at the close', M.tot_follow, 'small sample', 'opening totals on file since 2023'),
    row('Unders outdoors, wind 10+ mph', M.wind_under, 'the one venue effect', `since 2021: ${M.wind_under_recent ? M.wind_under_recent[0] + '-' + M.wind_under_recent[1] : ''}`),
    row('Overs in domes', M.dome_over, 'no edge', `outdoors overs went ${M.out_over ? M.out_over[0] + '-' + M.out_over[1] : ''}`),
    row('Home team against the spread, in domes', M.dome_home, 'no edge', `outdoors ${M.out_home ? M.out_home[0] + '-' + M.out_home[1] : ''}`)]
    : [row('Follow the move, bet at the close', M.follow_close, 'about break-even', 'the side the spread moved toward, after it moved'),
