function tdHtml(R, g) {
  const rows = live(R, g).filter(x => x.p.role || x.p.td > 0).sort((a, b) => b.p.tdg / b.p.gp - a.p.tdg / a.p.gp || b.p.rz[0] - a.p.rz[0]);
  const body = rows.map(({ p, t, opp }) => { const a = p.role ? R.allow[opp][p.role].td : null, pr = PMAP[`NFL|${g.id}|${p.id}|any_td`], pm = pr ? 1 - Math.exp(-pr.mu) : null, r = p.tdg / p.gp;
    return `<tr><td class="pc">${pname(p, g.id, ['any_td'])}<small>${p.role || p.pos} · ${t}</small></td><td>${p.td}</td><td class="barc" style="--w:${Math.round(r * 100)}%"><b>${p.tdg} of ${p.gp}</b><small>${Math.round(r * 100)}% of games</small></td><td>${nz(p.rz[0], 1)}</td><td>${p.rz[3] || !p.rz[0] ? nz(p.rz[3], 0) + '%' : '<span class="mut" title="His looks came with another club">·</span>'}</td><td>${a ? `${nz(a[0], 2)} ${rk(a[1])}` : '·'}</td><td>${pm == null ? '<span class="mut">·</span>' : `<b>${odds(E.amer(pm))}</b><small>${pct(pm)}</small>`}</td></tr>`; }).join('');
  return sheet('Anytime touchdown: who scores, and how often', `<table class="rt"><thead><tr><th class="pc">Player</th><th>TDs</th><th>Scored in</th><th>Red zone looks a game</th><th>Share of team's looks</th><th>TDs a game the opponent allows his role</th><th>Model fair price</th></tr></thead><tbody>${body}</tbody></table>`) +
    `<p class="note">Rushing and receiving touchdowns only. A red zone look is a carry or a target from the 20 or closer. The fair price is the model's own, before any book line: compare it with the anytime price your book shows, and expect the book to shade every name.</p>`;
}

function ftdHtml(R, g) {
  const eo = R.early.off, ed = R.early.dfn;
  const tiles = sides(g).map(([o, d]) => `<div class="tile"><small>${o} first two drives</small><b>${nz(eo[o][0], 0)}%</b><span class="tn">of ${eo[o][1]} opening drives ended in a touchdown, rank ${rk(eo[o][2])} The ${esc(R.teams[d].n)} have allowed one on ${nz(ed[d][0], 0)}% of ${ed[d][1]}, rank ${rk(ed[d][2])} League: ${nz(R.early.lg, 0)}%.</span></div>`).join('');
  const rows = live(R, g).filter(x => x.p.ftd > 0 || x.p.early[0] >= 4).sort((a, b) => b.p.ftd - a.p.ftd || b.p.early[1] - a.p.early[1]);
  return `<div class="tiles t2">${tiles}</div>` + sheet('First touchdown of the game', `<table class="rt"><thead><tr><th class="pc">Player</th><th>First TDs</th><th>Games</th><th>Touches on the first two drives</th><th>Share of team's early touches</th><th>All TDs</th></tr></thead><tbody>${rows.map(({ p, t }) =>
    `<tr><td class="pc">${pname(p, g.id, ['any_td'])}<small>${p.role || p.pos} · ${t}</small></td><td><b>${p.ftd}</b></td><td>${p.gp}</td><td>${p.early[0]}</td><td class="barc" style="--w:${Math.min(100, Math.round(p.early[1] * 2))}%">${nz(p.early[1], 0)}%</td><td>${p.td}</td></tr>`).join('')}</tbody></table>`) +
    `<p class="note">First TDs counts games where he scored the first offensive touchdown by either team. A touch is a carry or a target. The sample is small by nature: nine or ten games, one first score each. Read the early touches, which repeat, before the count, which mostly does not.</p>`;
}

function rzHtml(R, g) {
  const T = R.rz.team, Dn = R.rz.dfn;
  const tiles = sides(g).map(([o, d]) => `<div class="tile"><small>${o} inside the 20</small><b>${nz(T[o].tdr * 100, 0)}%</b><span class="tn">of ${nz(T[o].trips, 1)} trips a game end in a touchdown. The ${esc(R.teams[d].n)} allow one on ${nz(Dn[d].tdr * 100, 0)}% of ${nz(Dn[d].trips, 1)} trips a game, rank ${rk(Dn[d].rk)} League: ${nz(R.rz.lg * 100, 0)}%.</span></div>`).join('');
  const rows = live(R, g).filter(x => x.p.rz[1] + x.p.rz[2] > 0).sort((a, b) => b.p.rz[0] - a.p.rz[0]);
  return `<div class="tiles t2">${tiles}</div>` + sheet('Who gets the ball inside the 20', `<table class="rt"><thead><tr><th class="pc">Player</th><th>Looks a game</th><th>Carries</th><th>Targets</th><th>Share of team's looks</th><th>Red zone TDs</th></tr></thead><tbody>${rows.map(({ p, t }) =>
    `<tr><td class="pc">${pname(p, g.id, ['any_td', 'rush_yds', 'rec_yds'])}<small>${p.role || p.pos} · ${t}</small></td><td><b>${nz(p.rz[0], 1)}</b></td><td>${p.rz[1]}</td><td>${p.rz[2]}</td><td class="barc" style="--w:${Math.min(100, Math.round(p.rz[3]))}%">${nz(p.rz[3], 0)}%</td><td>${p.rz[4]}</td></tr>`).join('')}</tbody></table>`) +
    `<p class="note">A trip is a drive that ran a play from the 20 or closer. Share is his looks over the team's looks in the games he played.</p>`;
}

function lanesHtml(R, g) {
  const LN = ['left', 'middle', 'right'];
  const one = (p, def) => { const D = R.run.dfn[def];
    return `<div class="card"><div class="lh">${pname(p, g.id, ['rush_yds', 'rush_att'])}<small>${p.role || p.pos} · ${p.t} · ${p.run.n} runs · ${nz(p.run.share, 0)}% of team carries</small></div><div class="lanes">${LN.map((l, i) => { const d = D[l];
      const n = Math.round(p.run.mix[i] / 100 * p.run.n);
      return `<div class="lane" style="--n:${Math.min(100, p.run.mix[i])};--j:${i}"><small>${l}<br>${n} run${n === 1 ? '' : 's'}</small><div class="lz"><i></i><b>${nz(p.run.mix[i], 0)}%</b></div><span>${n ? nz(p.run.ypc[i], 1) + ' a carry' : 'none yet'}</span><em>${def} allows ${nz(d[0], 1)} ${rk(d[1])}</em></div>`; }).join('')}</div></div>`; };
  const cards = sides(g).flatMap(([o, d]) => (R.by[o] || []).filter(p => p.run && p.run.share > 0 && p.run.n >= (p.pos === 'RB' ? 15 : 30) && on(p)).sort((a, b) => b.run.n - a.run.n).slice(0, 3).map(p => one(p, d)));
  return `<div class="two">${cards.join('') || '<div class="card"><span class="mut">No back on either side has 15 charted runs yet.</span></div>'}</div>
    <p class="note">Each column is a lane, seen from behind the offense. The bar is how much of his running goes that way. Under it: his yards a carry in that lane, then what this defense allows there and where that ranks (rank 1 allows the most). League average: left ${nz(R.run.lg.left, 1)}, middle ${nz(R.run.lg.middle, 1)}, right ${nz(R.run.lg.right, 1)}. Scrambles are left out. Backs need 15 charted runs to appear, anyone else 30.</p>`;
}

function shareHtml(R, g) {
  const P = R.per.includes(S.rs.per) ? S.rs.per : 'Full', nm = { Full: 'Full game', '1H': '1st half', '2H': '2nd half' };
  const tbl = t => { const rows = (R.by[t] || []).filter(p => R.share[p.id] && on(p)).map(p => [p, R.share[p.id][P]]).sort((a, b) => b[1][1] + b[1][6] - a[1][1] - a[1][6]).slice(0, 11);
    const bar = (v, k) => `<td class="barc" style="--w:${Math.min(100, Math.round(v * k))}%">${nz(v)}%</td>`;
    return sheet(`${esc(R.teams[t].n)} · ${(nm[P] || P).toLowerCase()}`, `<table class="rt"><thead><tr><th class="pc">Player</th><th>Targets</th><th>Target share</th><th>Catches</th><th>Rec yards</th><th>Air yards share</th><th>Carries</th><th>Carry share</th><th>Rush yards</th><th>Red zone share</th></tr></thead><tbody>${rows.map(([p, s]) =>
      `<tr><td class="pc">${pname(p, g.id, ['rec_yds', 'rush_yds', 'pass_yds'])}<small>${p.role || p.pos}</small></td><td>${nz(s[0])}</td>${bar(s[1], 2)}<td>${nz(s[2])}</td><td>${nz(s[3])}</td><td>${nz(s[4], 0)}%</td><td>${nz(s[5])}</td>${bar(s[6], 1)}<td>${nz(s[7])}</td><td>${nz(s[8], 0)}%</td></tr>`).join('')}</tbody></table>`); };
  return `${chips('per', P, R.per.map(p => [p, nm[p] || p]), 'Period')}<div class="two w">${tbl(g.away)}${tbl(g.home)}</div>
    <p class="note">Counts are a game. Shares are his part of the team's total in the games he played, inside the period picked. A back whose share climbs in the second half is the one closing games; a receiver whose share lives in the first quarter is scripted in.</p>`;
}

const BCOLS = { all:  [['pts','Points'],['epa','EPA a play'],['succ','Success %'],['ypp','Yards a play'],['expl','Explosive %'],['third','3rd down %'],['rztd','Red zone TD %'],['to','Turnovers']],
                pass: [['pyd','Pass yards'],['ypa','Yards an attempt'],['cmp','Completion %'],['ptd','Pass TD'],['int','INT'],['xpass','Passes of 20+ %'],['sack','Sack %'],['press','Pressure %'],['adot','Depth of target',0],['deep','Deep throw %',0],['blitz','Blitz %',0]],
                rush: [['ruyd','Rush yards'],['ypc','Yards a carry'],['rutd','Rush TD'],['xrush','Runs of 10+ %'],['stuff','Stuffed %'],['ybc','Yards before contact']],
                misc: [['pen','Penalties'],['peny','Penalty yards'],['qbhit','QB hits']] };
const bdec = k => k === 'epa' ? 3 : /^(ypp|ypa|ypc|ybc|adot)$/.test(k) ? 2 : 1;
function teamsHtml(R, g) {
  const side = S.rs.side === 'dfn' ? 'dfn' : 'off', B = R.board[side], grp = BCOLS[S.rs.grp] ? S.rs.grp : 'all', cols = BCOLS[grp], sk = cols.some(c => c[0] === S.rs.sort) ? S.rs.sort : cols[0][0];
  const ts = Object.keys(B).sort((a, b) => B[a][sk][1] - B[b][sk][1] || a.localeCompare(b));
  return `<div class="rctl">${chips('side', side, [['off', 'Offense'], ['dfn', 'Defense']], 'Side')}${chips('grp', grp, [['all', 'Overall'], ['pass', 'Passing'], ['rush', 'Rushing'], ['misc', 'Discipline']], 'Columns')}</div>
    ${sheet('', `<table class="rt stick"><thead><tr><th>Team</th>${cols.map(([k, n]) => `<th aria-sort="${k === sk ? 'ascending' : 'none'}"><button data-rs="sort:${k}">${n}${k === sk ? ' ▾' : ''}</button></th>`).join('')}</tr></thead><tbody>${ts.map(t =>
      `<tr class="${t === g.away || t === g.home ? 'me' : ''}"><td><b class="tm">${t}</b></td>${cols.map(([k, , tone]) => `<td>${nz(B[t][k][0], bdec(k))} ${rk(B[t][k][1], tone === 0 ? 0 : 1)}</td>`).join('')}</tr>`).join('')}</tbody></table>`)}
    <p class="note">A game, except rates. Rank 1 is the best at it for the side shown, and a column header sorts by it. The two teams in the fixture are shaded. On the defense side each figure is what that defense gives up, apart from sacks, pressure, QB hits, interceptions, turnovers and stuffs, which it creates. Depth of target, deep throws and blitz rate are styles, not grades, so they carry no colour. Explosive: a pass of 20 or a run of 10.</p>`;
}

const TEND = [['proe','Pass rate over expected','%'],['npass','Pass rate, score and clock neutral','%'],['pace','Seconds of possession a play',''],['plays','Plays a game',''],['shot','Shotgun','%'],['nohud','No huddle','%'],['pa','Play action on dropbacks','%'],['motion','Motion at the snap','%'],['screen','Screens','%'],['rpo','Run-pass option','%'],['go4','Goes for it on 4th and 2 or less','%'],['box','Defense: men in the box against the run',''],['dblitz','Defense: blitz rate','%']];
function tendHtml(R, g) {
  const T = R.tend, all = Object.keys(T);
  const rows = TEND.map(([k, n, u]) => { const v = all.map(t => T[t][k][0]).filter(x => x != null).sort((a, b) => a - b); if (!v.length) return '';
    const lo = v[0], hi = v[v.length - 1], med = v[v.length >> 1], X = x => (8 + (hi > lo ? (x - lo) / (hi - lo) : .5) * 204).toFixed(1), a = T[g.away][k], h = T[g.home][k], d = k === 'proe' || k === 'pace' || k === 'box' ? 2 : 1, f = x => (k === 'proe' ? sgn(x, d) : nz(x, d)) + u;
    return `<tr><td class="pc tl">${n}</td><td class="trk"><svg viewBox="0 0 220 26" role="img" aria-label="${g.away} ${f(a[0])}, ${g.home} ${f(h[0])}, league middle ${f(med)}"><line x1="8" x2="212" y1="13" y2="13" stroke="var(--rule)" stroke-width="2"/><line x1="${X(med)}" x2="${X(med)}" y1="4" y2="22" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="2 2"/><circle cx="${X(a[0])}" cy="13" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/><rect x="${X(h[0]) - 5.5}" y="7.5" width="11" height="11" transform="rotate(45 ${X(h[0])} 13)" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"/></svg></td><td>${f(a[0])}${k === 'go4' ? ` <small class="in">of ${T[g.away].go4n[0]}</small>` : ''} ${rk(a[1], 0)}</td><td>${f(h[0])}${k === 'go4' ? ` <small class="in">of ${T[g.home].go4n[0]}</small>` : ''} ${rk(h[1], 0)}</td></tr>`; }).join('');
  return sheet('How each team chooses to play', `<table class="rt"><thead><tr><th class="pc">Tendency</th><th class="pc">League low to high</th><th>&#9675; ${g.away}</th><th>&#9670; ${g.home}</th></tr></thead><tbody>${rows}</tbody></table>`) +
    `<p class="note">The open circle is ${g.away}, the diamond is ${g.home}, the dashed tick is the league's middle team. Ranks count from the most, except pace, where rank 1 is the fastest. Pass rate over expected compares each call with what the league does in the same down, distance, score and clock. A pass-heavy team against a defense that invites the pass lifts every receiving line on the card; a slow, run-first pairing shrinks the whole game.</p>`;
}

const TR = [['Pass protection against the rush', [['sack', 'Sack rate', '%'], ['press', 'Pressure rate', '%'], ['qbhit', 'QB hits a game', ''], ['blitz', 'Blitz rate faced, and sent', '%', 0]]],
            ['Run blocking against the front', [['ypc', 'Yards a carry', '', 1, 2], ['ybc', 'Yards before contact', '', 1, 2], ['stuff', 'Stuffed for no gain', '%'], ['xrush', 'Runs of 10 or more', '%']]]];
function lineHtml(R, g) {
  const O = R.board.off, D = R.board.dfn;
  const side = ([o, d]) => `<div class="card"><div class="sec"><h3><span>${o} line against the ${esc(R.teams[d].n)} front</span></h3></div><div class="scroll"><table class="rt"><thead><tr><th class="pc">Measure</th><th>${o} offense</th><th>${d} defense</th><th>Edge</th></tr></thead><tbody>
    ${TR.map(([h, ms]) => `<tr class="sub"><td colspan="4">${h}</td></tr>` + ms.map(([k, n, u, tone, dp]) => { const a = O[o][k], b = D[d][k], df = b[1] - a[1], e = tone === 0 ? '' : df >= 10 ? `<span class="rate g">${o}</span>` : df <= -10 ? `<span class="rate b">${d}</span>` : '<span class="rate n">Even</span>';
      return `<tr><td class="pc tl">${n}</td><td>${nz(a[0], dp || 1)}${u} ${rk(a[1], tone === 0 ? 0 : 1)}</td><td>${nz(b[0], dp || 1)}${u} ${rk(b[1], tone === 0 ? 0 : 1)}</td><td>${e}</td></tr>`; }).join('')).join('')}</tbody></table></div>
    <div class="sec" style="margin-top:16px"><h3><span>${d} pass rushers</span></h3></div><div class="scroll"><table class="rt"><thead><tr><th class="pc">Rusher</th><th>Pressures</th><th>Sacks</th><th>Hurries</th></tr></thead><tbody>${(R.rushers[d] || []).slice(0, 5).map(r => `<tr><td class="pc">${esc(r[0])} <small class="in">${esc(r[1])}</small></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec" style="margin-top:16px"><h3><span>${d} in coverage: what each defender has allowed</span></h3></div><div class="scroll"><table class="rt"><thead><tr><th class="pc">Defender</th><th>Targets</th><th>Completion %</th><th>Yards</th><th>Yards a target</th><th>TD</th><th>INT</th><th>Passer rating</th></tr></thead><tbody>${(R.cover[d] || []).slice(0, 7).map(c => `<tr><td class="pc">${esc(c[0])} <small class="in">${esc(c[1])}</small></td><td>${c[2]}</td><td>${nz(c[3], 0)}%</td><td>${c[4]}</td><td>${nz(c[5], 1)}</td><td>${c[6]}</td><td>${c[7]}</td><td>${nz(c[8], 1)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return `<div class="two">${sides(g).map(side).join('')}</div>
    <p class="note">Each rank is 1 for the best at it on that side of the ball. The edge stamp names a side when the two ranks sit ten or more places apart. The coverage table is as close as free data gets to a receiver against cornerback sheet: it shows what each defender has given up when targeted, as charted by Pro Football Reference, not who he will line up across from.</p>`;
}

/* hit rates: the last ten games against the line on file, beside the desk's own chance */
function hitHtml() {
  const lg = S.lg, H = S.rs;
  if (H.hg !== 'all' && !IDX[lg].games[H.hg]) H.hg = 'all';
  if (H.hm !== 'all' && !MK[lg][H.hm]) H.hm = 'all';
  const base = PROPS.filter(pr => !pr.binary && getLine(pr.key)), mks = [...new Set(base.map(p => p.mkt))], gms = [...new Set(base.map(p => p.e.side.game))];
  const rows = base.filter(pr => (H.hg === 'all' || pr.e.side.game === H.hg) && (H.hm === 'all' || pr.mkt === H.hm)).map(pr => {
    const ln = getLine(pr.key), v = logVals(pr).slice(-10), opp = pr.e.p.logs.opp.slice(-10), tg = logTags(pr).slice(-10), hit = a => a.filter(x => x > ln.line).length, l5 = v.slice(-5), vo = v.filter((x, i) => opp[i] === pr.e.side.opp), a = assess(pr);
    return { pr, ln, v, opp, tg, h5: hit(l5), n5: l5.length, h10: hit(v), n10: v.length, a10: avg(v), vo, ho: hit(vo), po: a ? a.sp.over : null }; }).filter(r => r.n10 >= 3);
  rows.sort((a, b) => (H.hs === 'under' ? 1 : -1) * (a.h10 / a.n10 - b.h10 / b.n10) || b.n10 - a.n10 || a.pr.e.p.name.localeCompare(b.pr.e.p.name));
  const row = (r, i) => { const pr = r.pr, p = pr.e.p, M = MK[lg][pr.mkt], q = r.h10 / r.n10;
    return `<button class="row pl${S.memo === pr.key ? ' sel' : ''}${S.fresh && i < 16 ? ' in' : ''}" style="--i:${i};${tcol(lg, p.team)}" data-open="${esc(pr.key)}">${whoHtml(pr, 'over ' + r.ln.line + ' ' + M.s)}
      <span class="cells hr"><span class="cell"><small>Last ${r.n5}</small><span>${r.h5} of ${r.n5}</span></span><span class="cell"><small>Last ${r.n10}</small><span class="${q >= .7 ? 'pos' : q <= .3 ? 'neg' : ''}">${r.h10} of ${r.n10}</span></span><span class="cell"><small>Average</small><span>${f1(r.a10)}</span></span>
      <span class="cell"><small>vs ${esc(pr.e.side.opp)}</small><span class="${r.vo.length ? '' : 'mut'}">${r.vo.length ? r.ho + ' of ' + r.vo.length : '·'}</span></span><span class="cell"><small>Desk over</small><span>${r.po == null ? '·' : pct(r.po)}</span></span>
      <span class="cell"><small>Oldest to latest</small><span class="punch" role="img" aria-label="Over the line in ${r.h10} of the last ${r.n10}">${r.v.map((x, j) => `<i class="${x > r.ln.line ? 'h' : ''}" title="${esc(r.tg[j])} ${esc(r.opp[j])}: ${x}"></i>`).join('')}</span></span></span></button>`; };
  const G = IDX[lg].games;
  return `<div class="filters"><select id="rsHG" aria-label="Game"><option value="all">All games</option>${gms.map(id => `<option value="${id}"${H.hg === id ? ' selected' : ''}>${esc(gameLabel(lg, G[id]))}</option>`).join('')}</select>
    <select id="rsHM" aria-label="Market"><option value="all">All markets</option>${mks.map(k => `<option value="${k}"${H.hm === k ? ' selected' : ''}>${MK[lg][k].n}</option>`).join('')}</select>
    <select id="rsHS" aria-label="Sort"><option value="over"${H.hs === 'over' ? ' selected' : ''}>Most overs first</option><option value="under"${H.hs === 'under' ? ' selected' : ''}>Most unders first</option></select></div>
    <div class="strip"><span><b>${rows.length}</b> props with a line on file</span><span>Lines: Hard Rock from the daily pull, or any you entered on the Board</span></div>
    <div class="ledger">${rows.slice(0, 120).map(row).join('') || `<div class="row"><span class="mut">No ${lg} lines on file for this slate. Enter a book line on the Board and the prop shows up here.</span></div>`}</div>
    <p class="note">Each mark is one game, oldest on the left. A filled mark went over today's line. The book has seen the same ten games and set the line with them in mind, so a streak on its own is not an edge. The desk column is the chance after the model and the other books are weighed. Where the streak and the desk disagree, open the memo before leaning on either.${lg === 'NFL' ? ' NFL marks can reach back into last season.' : ''}</p>`;
}

function rsGaps() {
  return `<details class="card gaps"><summary>Not in this room yet, and what each would take</summary><ul class="prose" style="max-width:86ch">
    <li><b>Hit rates on every market and alternate line, trends by split, market grades.</b> These need a line for every player in every market, every day. That is The Odds API 20K plan at $30 a month, plus a small scheduled job that saves the lines where this page can read them. Today's hit rates cover only the lines the desk already pulls.</li>
    <li><b>Alignment matchups, receiver against cornerback, coverage scheme by defense.</b> Hand-charted data that is sold to teams and media. No source at a consumer price carries it for the season in progress. The Trenches sheet holds the closest free stand-in.</li>
    <li><b>NBA matchup sheets and trends by split.</b> Free data covers these. They are the next build.</li></ul></details>`;
}
function rsBody() {
  const tool = rsTool(); if (tool === 'hit') return hitHtml();
  if (RS.st === 'error') return `<div class="banner"><span>The research file did not load.</span><button class="btn ghost sm" data-act="rsRetry">Try again</button></div>`;
  if (RS.st !== 'ready') return `<div class="card"><span class="lbl">Pulling the form book</span><div class="wait"><i></i><i></i><i></i></div></div>`;
  const R = RS.d, g = rsGame(R); S.rs.game = g.id;

  if (t.dataset.del) { S.store.book = S.store.book.filter(b => b.id !== t.dataset.del); persist(); render(); return; }
  const a = t.dataset.act;
  if (a === 'close') { S.memo = null; render(); }
  else if (a === 'rsRetry') { RS.st = 'idle'; loadResearch(); rsPaint(); }
  else if (a === 'tape') { S.tapePaused = !S.tapePaused; const tp = $('#tape'); tp.classList.toggle('paused', S.tapePaused); t.textContent = S.tapePaused ? 'Run' : 'Hold'; t.setAttribute('aria-pressed', S.tapePaused); }
  else if (a === 'more') { S.limit += 80; render(); }
  else if (a === 'resetScen') { S.scen[S.lg] = {}; render(); }
  else if (a === 'clearLine' && pr) { delete S.store.lines[pr.key]; persist(); render(); }
  else if (a === 'stress' && pr) { go(() => { S.stressSide = pr.e.side.game + '|' + pr.e.side.team; S.tab = 'stress'; S.memo = null; render(); window.scrollTo(0, 0); }, 'fwd'); }
  else if (a === 'log' && pr) { const r = assess(pr); if (!r) return; const g = IDX[pr.lg].games[pr.e.side.game], stake = Math.max(0, parseFloat($('#mStake').value) || 0); if (!stake) return;
    S.store.book.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), lg: pr.lg, pid: pr.e.p.id, name: pr.e.p.name, mkt: pr.mkt, binary: pr.binary, side: r.best.side, line: r.ln.line,
      odds: r.best.odds, stake: Math.round(stake * 100) / 100, p: r.best.pn, rating: r.rating, cls: r.cls, gl: gameLabel(pr.lg, g), tag: pr.lg === 'NBA' ? g.day.slice(5) : '26W' + DATA.NFL.label.replace(/\D/g, ''), status: 'open', result: null });
    persist(); t.textContent = 'Logged'; t.disabled = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fGame') { S.game = t.value; S.limit = 80; S.fresh = true; render(); }
  else if (t.id === 'fMkt') { S.mkt = t.value; S.limit = 80; S.fresh = true; render(); }
  else if (t.id === 'fSort') { S.sort = t.value; S.fresh = true; render(); }
  else if (t.id === 'sSide') { S.stressSide = t.value; render(); }
  else if (t.id === 'rsGame') { S.rs.game = t.value; rsPaint('#rsGame'); }
  else if (t.id === 'rsHG' || t.id === 'rsHM' || t.id === 'rsHS') { S.rs[{ rsHG: 'hg', rsHM: 'hm', rsHS: 'hs' }[t.id]] = t.value; rsPaint('#' + t.id); }
  else if (t.id === 'relMkt') { S.relMkt = t.value; render(); }
  else if (t.dataset.tog) { const p = IDX[S.lg].byId[t.dataset.tog]; if (t.checked === p.active) delete S.scen[S.lg][p.id]; else S.scen[S.lg][p.id] = t.checked; render(); }
  else if (t.id === 'sBank') { const v = parseFloat(t.value); if (v > 0) { S.store.settings.bank = v; persist(); } render(); }
  else if (t.id === 'sKf') { S.store.settings.kf = parseFloat(t.value); persist(); }
  else if (t.id === 'sOdds') { const v = parseOdds(t.value); if (v != null) { S.store.settings.odds = v; persist(); } render(); }
  else if (t.id === 'mLine' || t.id === 'mOver' || t.id === 'mUnder') { const pr = PMAP[S.memo]; if (!pr) return;
    const patch = {}; if (t.id === 'mLine') { const v = parseFloat(t.value); if (!(v > 0)) return liveMemo(); patch.line = v; }
    else { const v = parseOdds(t.value); t.value = v == null ? '' : odds(v); patch[t.id === 'mOver' ? 'o' : 'u'] = v; }
    setLine(pr, patch); liveMemo(); refreshMain(); }
});
let qT; document.addEventListener('input', e => { if (e.target.id !== 'fQ') return; S.q = e.target.value; clearTimeout(qT); qT = setTimeout(() => { S.limit = 80; const a = filtered(); const el = $('#ledger'); if (el) el.innerHTML = a.slice(0, S.limit).map(rowHtml).join('') || '<div class="row"><span class="mut">No props match these filters.</span></div>'; }, 140); });
/* drag the line on the distribution */
let drag = false;
function dragTo(ev) { const pr = PMAP[S.memo], svg = $('#mDist'); if (!pr || pr.binary || !svg) return; const g = svg.querySelector('g'), lo = +g.dataset.lo, hi = +g.dataset.hi, r = svg.getBoundingClientRect();
  const fx = (ev.clientX - r.left) / r.width * 560, v = (lo - .5) + (fx - 10) / 540 * (hi - lo + 1), line = Math.min(hi + .5, Math.max(.5, Math.round(v - .5) + .5));
  if (line !== draftLine(pr).line || draftLine(pr).draft) { setLine(pr, { line }); liveMemo(); } }
document.addEventListener('pointerdown', e => { const s = e.target.closest && e.target.closest('#mDist'); if (!s) return; drag = true; try { s.setPointerCapture(e.pointerId); } catch (x) {} dragTo(e); });

const endDrag = () => { if (drag) { drag = false; refreshMain(); } };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.memo) { S.memo = null; render(); } });

grade(); render(); enhance(); cloud(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeInk);
